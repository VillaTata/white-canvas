name: Deploy Vite site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify dependencies, tests, types, and lint
        run: |
          npm audit
          npm test
          npm run typecheck
          npm run lint
      - name: Restore last valid Airbnb reviews
        uses: actions/cache/restore@v4
        with:
          path: public/reviews.json
          key: airbnb-reviews-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: airbnb-reviews-
      - name: Fetch Airbnb reviews
        run: npm run reviews:fetch
        env:
          STAYAPI_API_KEY: ${{ secrets.STAYAPI_API_KEY }}
          AIRBNB_LISTING_ID: "1335775644190168406"
      - name: Save last valid Airbnb reviews
        uses: actions/cache/save@v4
        with:
          path: public/reviews.json
          key: airbnb-reviews-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
